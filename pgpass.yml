# Database settings
db_name: "telegram_bot_db"
db_user: "telegram_user"
db_password: "123"

# Replication settings
replication_user: "replicator"
replication_password: "123"

# PostgreSQL version
postgresql_version: "15"

# IP addresses - MUST REPLACE!
master_ip: "YOUR_MASTER_SERVER_IP_HERE"
slave_ip: "YOUR_SLAVE_SERVER_IP_HERE"
bot_ip: "YOUR_BOT_SERVER_IP_HERE"

# Bot settings
bot_repo: "https://github.com/Drdre888/devops_bot.git"
bot_branch: "Ansible"
bot_dir: "/opt/telegram-bot"
venv_dir: "/opt/telegram-bot/venv"

# Telegram bot token - GET FROM @BotFather!
TOKEN: "YOUR_TELEGRAM_BOT_TOKEN_HERE"

# Remote management credentials
RM_USER: "YOUR_REMOTE_USERNAME_HERE"
RM_PASSWORD: "YOUR_REMOTE_PASSWORD_HERE"
